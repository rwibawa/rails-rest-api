---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/":
    get:
      summary: list posts
      responses:
        '200':
          description: successful
  "/api/v1/posts":
    get:
      summary: list posts
      responses:
        '200':
          description: successful
    post:
      summary: create post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - post
              properties:
                post:
                  type: object
                  required:
                  - title
                  - content
                  properties:
                    title:
                      type: string
                      example: Hello world
                    content:
                      type: string
                      example: A sample post body
      responses:
        '201':
          description: created
  "/api/v1/posts/{id}":
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: string
    get:
      summary: show post
      responses:
        '200':
          description: successful
    patch:
      summary: update post
      responses:
        '200':
          description: successful
    put:
      summary: update post
      responses:
        '200':
          description: successful
    delete:
      summary: delete post
      responses:
        '200':
          description: successful
servers:
- url: /
